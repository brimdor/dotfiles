  type: "archive-file"
  url: "https://github.com/aristocratos/btop/releases/download/v{{ template "get-github-latest-version" list "aristocratos/btop"}}/btop-{{ if eq .chezmoi.arch "arm64" }}aarch64{{ else }}x86_64{{ end }}-unknown-linux-musl.tbz"
